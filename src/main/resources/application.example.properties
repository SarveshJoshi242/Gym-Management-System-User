# ═══════════════════════════════════════════════════════════════
#  GymPlus — Application Configuration
#  Copy this file to application.properties and fill in values
#  OR set the corresponding environment variables on your system
# ═══════════════════════════════════════════════════════════════

# === Database ===
# Local:   jdbc:mysql://localhost:3306/gym_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Railway: jdbc:mysql://<MYSQLHOST>:<MYSQLPORT>/<MYSQLDATABASE>?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_database_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Gemini AI API Key ===
# Get yours at: https://aistudio.google.com/apikey
gemini.api.key=${GEMINI_API_KEY:your_google_gemini_api_key_here}

# === Server Port ===
# Render injects PORT automatically — do NOT set it manually on Render
server.port=${PORT:8080}

# === CORS — Frontend URL ===
# Set to your Vercel URL in production (e.g. https://gymplus.vercel.app)
cors.allowed.origin=${FRONTEND_URL:http://localhost:8080}

# === JPA/Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === Static files & errors ===
spring.mvc.static-path-pattern=/**
server.error.include-message=always
