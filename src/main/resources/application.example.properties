spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_secure_database_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gemini AI API Key
gemini.api.key=${GEMINI_API_KEY:your_google_gemini_api_key_here}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# API CORS (if frontend is served from elsewhere, but here it's static)
spring.mvc.static-path-pattern=/**

# Error Handling
server.error.include-message=always
